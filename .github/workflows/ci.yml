name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Test BoskCore
        run: swift test --package-path Packages/BoskCore

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app
        run: xcodebuild -scheme Bosk -configuration Debug -destination 'platform=macOS' build
